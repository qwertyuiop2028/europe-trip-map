<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>歐洲放射遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-height app. Map on the left, a 4-step panel (地形 → 區域 → 住宿點 → 每日輻射) on the right. Phones stack map over panel. */
:root{
  --sea:#c3d6df; --land:#f5f6f1; --ink:#18262e; --muted:#5a6d77; --line:#c5d2d8;
  --panel:#fbfcfb; --chip:#eaf0f2; --route:#d9532b; --good:#2f8a4f; --bad:#8a8f94;
  --t-mount:#6a5cb8; --t-sea:#0a8798; --t-plain:#6a952c; --t-small:#c04f93; --t-big:#c47400; --t-lake:#3a6fd0; --t-island:#12a37f; --t-nordic:#5a7388;
  --shade:rgba(106,92,184,.16); --track:#b36b00;
  --k0:#e3eee6; --k1:#e8e5f1; --k2:#f1e5e1; --k3:#e1ebf3; --k4:#efecd6; --k5:#f0e1ea; --kf:#eaedea; --border:#9fb2ba; --cname:#6b7f89;
  --f-body:'Noto Sans TC',system-ui,-apple-system,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0e1b23; --land:#1b2b34; --ink:#e5eef1; --muted:#93a8b2; --line:#2c4049;
  --panel:#13222a; --chip:#1c3039; --route:#ff7a4d; --good:#5cc47f; --bad:#6f7f87;
  --t-mount:#a79df0; --t-sea:#4fc3d1; --t-plain:#a3cf63; --t-small:#e68ac1; --t-big:#f2b24a; --t-lake:#7aa7ff; --t-island:#4fd1a8; --t-nordic:#9db4c6;
  --shade:rgba(167,157,240,.16); --track:#ffc65c; color-scheme:dark;
  --k0:#213630; --k1:#2a2942; --k2:#3a2b2b; --k3:#203542; --k4:#37351f; --k5:#3a2637; --kf:#1a262c; --border:#4c6773; --cname:#8aa2ad}}
:root[data-theme="dark"]{
  --sea:#0e1b23; --land:#1b2b34; --ink:#e5eef1; --muted:#93a8b2; --line:#2c4049;
  --panel:#13222a; --chip:#1c3039; --route:#ff7a4d; --good:#5cc47f; --bad:#6f7f87;
  --t-mount:#a79df0; --t-sea:#4fc3d1; --t-plain:#a3cf63; --t-small:#e68ac1; --t-big:#f2b24a; --t-lake:#7aa7ff; --t-island:#4fd1a8; --t-nordic:#9db4c6;
  --shade:rgba(167,157,240,.16); --track:#ffc65c; color-scheme:dark;
  --k0:#213630; --k1:#2a2942; --k2:#3a2b2b; --k3:#203542; --k4:#37351f; --k5:#3a2637; --kf:#1a262c; --border:#4c6773; --cname:#8aa2ad}
html,body{height:100%}
body{background:var(--panel);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}
#app{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:100%}
#mapwrap{position:relative;min-width:0;min-height:0;background:var(--sea);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.ctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.ctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1}
.ctl button.txt{font-size:12px;width:auto;padding:0 8px;height:30px}
.hint{position:absolute;left:12px;top:12px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;max-width:calc(100% - 80px)}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;max-width:calc(100% - 24px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#panel{min-width:0;min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel)}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 8px}
.head h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em}
.head h1 small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);letter-spacing:.04em;margin-top:1px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 10px;font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 16px 10px}
.steps button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 4px;font-size:12px;color:var(--muted);text-align:center;min-width:0}
.steps button b{display:block;font-family:var(--f-mono);font-weight:500;font-size:11px}
.steps button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.steps button.done{color:var(--ink);background:var(--chip)}
.steps button:disabled{opacity:.55;cursor:default}
.steps button em{display:block;font-style:normal;font-size:10.5px;color:var(--route);line-height:1.2;margin-top:1px}
.tip{border:1px solid var(--ink);border-radius:10px;padding:10px 14px;margin:10px 0;background:var(--chip)}
.tip b{font-size:13px}
.tip ol{margin:6px 0 10px;padding-left:1.3em;font-size:13px}
.tip li{margin:2px 0}
.prog{display:grid;gap:4px;margin:10px 0 4px;font-size:13px}
.prog .bar{height:8px;border-radius:99px;background:var(--chip);border:1px solid var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--good);transition:width .25s}
.prog.full .bar i{background:var(--good)}
.help{font-size:12.5px;margin:6px 0 0}
#body{flex:1;min-height:0;overflow:auto;padding:4px 16px 16px;border-top:1px solid var(--line)}
#body h2{font-size:15px;margin:12px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.cards{display:grid;gap:8px}
.card{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 12px}
.card:hover{background:var(--chip)}
.card.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:5px}
.card b{display:block;font-weight:700}
.card small{display:block;color:var(--muted);font-size:12.5px}
.pill{display:inline-block;font-size:11px;border-radius:99px;padding:0 8px;margin-left:6px;border:1px solid currentColor;vertical-align:1px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row label{font-size:13px}
input[type=range]{flex:1;min-width:120px;accent-color:var(--route)}
.val{font-family:var(--f-mono);font-size:13px;min-width:5ch;text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 12px;font-size:13px}
.tabs button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.spot{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;display:grid;gap:4px}
.spot.focus{border-color:var(--route);box-shadow:inset 0 0 0 1px var(--route)}
.spot.ok{background:color-mix(in srgb,var(--good) 10%,transparent)}
.spot.no{opacity:.55}
.spot .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.spot .top b{min-width:0}
.spot .dist{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.spot small{color:var(--muted);font-size:12.5px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.links a{font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--chip)}
.links a:hover{border-color:var(--ink)}
.want{margin-left:auto;border:1px solid var(--ink);background:transparent;border-radius:8px;padding:3px 16px;font-size:13px;font-weight:500}
.want:hover{background:var(--chip)}
.want.on{background:var(--good);border-color:var(--good);color:#fff}
.seg{display:inline-flex;margin-left:auto;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:1px 10px;font-size:12px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on[data-v="ok"]{background:var(--good);color:#fff}
.seg button.on[data-v="no"]{background:var(--bad);color:#fff}
.seg button.on[data-v=""]{background:var(--chip);color:var(--ink)}
.sum{border:1px solid var(--ink);border-radius:10px;padding:10px 12px;margin:12px 0}
.sum h3{margin:0 0 6px;font-size:13px}
.sum .line{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
.warn{color:var(--route);font-size:12.5px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:8px;padding:6px 16px}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.35;cursor:default}
#body{display:flex;flex-direction:column;padding-bottom:0}
#body>*{flex:none}
#body>.nav{position:sticky;bottom:0;margin-top:auto;padding:10px 0 14px;background:var(--panel);border-top:1px solid var(--line);z-index:2}
#body>.nav::before{content:"";position:absolute;left:0;right:0;top:-24px;height:24px;background:linear-gradient(transparent,var(--panel));pointer-events:none;border-top:0}
.nav-gap{height:16px}
.crumb{display:flex;flex-wrap:wrap;gap:4px 2px;align-items:center;padding:0 16px 8px;font-size:12.5px;color:var(--muted);min-height:1.9em}
.crumb button{border:0;background:transparent;padding:0 4px;border-radius:4px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.crumb button:hover{text-decoration-color:var(--ink)}
.crumb i{font-style:normal;color:var(--line)}
.bulk{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.bulk button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:2px 10px;font-size:12.5px}
.bulk button:hover{border-color:var(--ink)}
#sheet{display:none;position:fixed;inset:0;z-index:50;background:var(--panel);overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#sheet.on{display:block}
.sheetbar{position:sticky;top:0;z-index:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.sheetbar .tabs{margin:0}
.sheetwrap{max-width:780px;margin:0 auto;padding:16px 16px 40px}
.sheetwrap h1{font-size:22px;margin:4px 0 2px}
.sheetwrap .meta{color:var(--muted);margin:0 0 14px;font-size:13px}
.sheetwrap .kv{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0 0 18px;font-size:13px}
.sheetwrap .kv b{font-family:var(--f-mono);font-weight:500}
.drow{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.drow .dn{font-family:var(--f-mono);font-weight:500}
.drow .dn small{display:block;color:var(--muted);font-size:11.5px}
.drow .what{min-width:0}
.drow .what b{font-weight:700}
.drow .what small{display:block;color:var(--muted);font-size:12.5px}
.drow .dst{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.drow .links{margin-top:4px}
.bh{grid-column:1/-1;font-size:12px;letter-spacing:.08em;color:var(--route);padding:14px 0 2px;border-top:2px solid var(--ink);margin-top:10px}
@media (max-width:520px){.drow{grid-template-columns:3.4em minmax(0,1fr)}.drow .dst{grid-column:2;text-align:left}}
.sw{display:none;position:absolute;left:12px;right:12px;bottom:56px;z-index:5;background:var(--panel);border:1px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
.sw.on{display:block}
.sw .btn{margin:8px 8px 0 0;padding:4px 14px}
.grip{display:none;height:22px;flex:none;cursor:ns-resize;touch-action:none;position:relative}
.grip::after{content:"";position:absolute;left:50%;top:8px;width:44px;height:5px;margin-left:-22px;border-radius:99px;background:var(--line)}
.fold{color:var(--muted);font-size:12.5px;margin:8px 0}
.note{font-size:12px;color:var(--muted);margin-top:10px}
@media (max-width:820px){
  body{overflow:hidden}
  #app{grid-template-columns:1fr;grid-template-rows:var(--mh,42%) minmax(0,1fr)}
  .grip{display:block}
  .head{padding:2px 16px 4px}
  .head h1{font-size:15px}
  .steps{padding-bottom:6px}
  .crumb{padding-bottom:4px}
  #panel{border-left:0;border-top:1px solid var(--line)}
  .hint{display:none}
  .legend{font-size:11px;padding:4px 8px}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>

<div id="sheet" role="dialog" aria-label="行程單"></div>
<div id="app">
  <div id="mapwrap">
    <svg id="map" role="img" aria-label="歐洲地形與景點地圖"></svg>
    <div class="hint">拖曳移動、滾輪縮放,點圓點選區域</div>
    <div class="ctl">
      <button id="zin" aria-label="放大">+</button>
      <button id="zout" aria-label="縮小">−</button>
      <button id="zall" class="txt">全歐</button>
      <button id="ztrack" class="txt" hidden>足跡</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <section id="panel">
    <div class="grip" id="grip" role="separator" aria-label="拖曳調整地圖與面板高度,點一下切換大小"></div>
    <div class="head"><h1>歐洲放射遊<small>選地形、定據點、排每日輻射</small></h1><button class="ghost" id="reset">重設</button></div>
    <div class="steps" id="steps"></div>
    <div class="crumb" id="crumb"></div>
    <div id="body"></div>
  </section>
</div>

/* 依標記為「合適」的景點排出逐日行程;不足的天數用範圍內未驗證景點補上 */
function buildPlan(){
  var r=R(),a=alloc(),bs=state.bases.map(function(id){return r.B.filter(function(b){return b.id===id})[0]}),two=bs.length===2;
  var days=[],n=0,over=[],unverified=0,used={};
  function push(o){o.n=++n;days.push(o)}
  bs.forEach(function(b,bi){
    var cnt=a[bi],first=bi===0,last=bi===bs.length-1;
    var spokes=Math.max(0,cnt-(first?1:0)-(last?1:0)-(two&&first?1:0)+(two&&first&&0));
    if(two&&first)spokes=Math.max(0,cnt-2);
    else if(two&&last)spokes=Math.max(0,cnt-1);
    else spokes=Math.max(0,cnt-2);
    var oks=r.S.filter(function(s){return state.marks[mk(r.id,b.id,s.i)]==='ok'}).map(function(s){var l=leg(r,b,s);return {s:s,l:l,src:'ok'}}).sort(function(x,y){return x.l.min-y.l.min});
    var sug=r.S.filter(function(s){var m=state.marks[mk(r.id,b.id,s.i)];return m!=='ok'&&m!=='no'&&leg(r,b,s).min<=state.maxMin&&(!(state.xmasOnly&&r.hasX)||s.tag==='x')}).map(function(s){var l=leg(r,b,s);return {s:s,l:l,src:'suggest'}}).sort(function(x,y){return x.l.min-y.l.min});
    /* 同一個景點只排一次:前一個住宿點用過的,後面的住宿點跳過 */
    oks=oks.filter(function(x){return !used[x.s.name]});sug=sug.filter(function(x){return !used[x.s.name]});
    var pick=oks.concat(sug).slice(0,spokes);
    pick.forEach(function(x){used[x.s.name]=1});
    oks.slice(spokes).forEach(function(x){over.push({s:x.s,base:b})});
    if(first)push({type:'arrive',base:b});
    pick.forEach(function(x){if(x.src==='suggest')unverified++;push({type:'spoke',base:b,spot:x.s,km:x.l.km,min:x.l.min,src:x.src})});
    if(two&&first)push({type:'transfer',base:b,to:bs[1]});
    if(last)push({type:'depart',base:b});
  });
  over=over.filter(function(x,i){return !used[x.s.name]&&over.findIndex(function(y){return y.s.name===x.s.name})===i});
  var xfer=two?leg(r,bs[0],bs[1]):{km:0,min:0};
  var drive=xfer.min,okc=0;
  days.forEach(function(d){if(d.type==='spoke'){drive+=d.min*2;if(d.src==='ok')okc++}});
  return {bs:bs,days:days,over:over,xfer:xfer,drive:drive,ok:okc,unverified:unverified};
}
function planText(p){

  p.days.forEach(function(d){
    var s='第 '+d.n+' 天'+(dayLabel(d.n)?' '+dayLabel(d.n):'')+' | 住 '+d.base.name+' | ';
    if(d.type==='arrive')s+='抵達、熟悉周邊';

    else if(d.type==='transfer')s+='換宿 → '+d.to.name+'('+Math.round(p.xfer.km)+' km,'+fmtMin(p.xfer.min)+')';

}

  var a=alloc(),pair='';
  if(state.bases.length===2){var A=r.B.filter(function(b){return b.id===state.bases[0]})[0],B=r.B.filter(function(b){return b.id===state.bases[1]})[0],l=leg(r,A,B);
    pair='<div class="sum"><h3>換宿移動</h3><div class="line"><span>'+A.name+' → '+B.name+'</span><span class="mono">約 '+Math.round(l.km)+' km · '+fmtMin(l.min)+'</span></div>'
      +'<div class="'+(l.min>240?'warn':'sub')+'" style="margin:4px 0 0;font-size:12.5px">'+(l.min>240?'兩個住宿點相距較遠,換宿日單程約 '+fmtMin(l.min)+',已自動算進行程和總車程。':'這段移動會自動算進換宿日和總車程。')+'</div></div>'}
  return '<h2>'+r.name+':住宿點</h2><p class="sub">建議 '+r.days+' 天。選 1 個住宿點就不換宿,選 2 個會換宿一次(目前每點住 '+a.join(' / ')+' 天)。也可以直接點地圖上的方塊。</p>'
   +'<div class="row"><label for="days">總天數</label><input id="days" type="range" min="7" max="21" value="'+state.days+'" data-act="days"><span class="val" id="daysv">'+state.days+' 天</span></div>'
   +'<div class="cards" style="margin-top:10px">'
   +r.B.map(function(b){var i=state.bases.indexOf(b.id);
     return '<button class="card'+(i>=0?' sel':'')+'" data-act="base" data-id="'+b.id+'"><span class="dot" style="background:var(--route);border-radius:3px">'+'</span><span><b>'+b.name+(i>=0?'<span class="pill mono" style="color:var(--route)">住宿 '+(i+1)+' · '+a[i]+' 天</span>':'')+'</b><small>'+b.note+'</small></span></button>'}).join('')
   +'</div>'+pair
   +'<div class="nav"><button class="btn alt" data-act="step" data-n="2">上一步</button><button class="btn" data-act="step" data-n="4">規劃每日輻射</button></div>';
}
function s4(){
  var r=R();if(!r||!state.bases.length)return '<p class="sub">先選好住宿點。</p>';
  var a=alloc(),act=r.B.filter(function(b){return b.id===state.active})[0]||r.B[0];
  var tabs=state.bases.map(function(id,i){var b=r.B.filter(function(x){return x.id===id})[0];return '<button data-act="active" data-id="'+id+'" class="'+(id===act.id?'on':'')+'">住宿 '+(i+1)+' · '+b.name+'</button>'}).join('');
  var list=r.S.map(function(s){var l=leg(r,act,s);return {s:s,km:l.km,min:l.min}}).sort(function(x,y){return x.min-y.min});
  var hasX=r.S.some(function(s){return s.tag==='x'});
  var inr=list.filter(function(x){return inRange(r,act,x.s)}),out=list.length-inr.length;
  var rows=inr.map(function(x){var s=x.s,m=getMark(s.i);
    return '<div class="spot '+(m||'')+(focusSpot===s.i?' focus':'')+'" id="sp'+s.i+'" data-spot="'+s.i+'"><div class="top"><b>'+s.name+(s.tag==='x'?'<span class="pill" style="color:var(--route)">聖誕市集</span>':'')+(HIST&&s.seenAny?'<span class="pill" style="color:var(--track)">去過 '+Object.keys(s.seen).map(function(i){return TRIPD[i].s.slice(0,4)}).filter(function(y,i,a){return a.indexOf(y)===i}).join('、')+'</span>':(HIST&&s.pass?'<span class="pill" style="color:var(--muted)">路過</span>':''))+'</b><span class="dist">'+Math.round(x.km)+' km · '+fmtMin(x.min)+'</span></div>'
     +(s.note?'<small>'+s.note+'</small>':'')
     +'<div class="acts"><span class="links"><a href="'+link('sv',s)+'" target="_blank" rel="noopener">街景</a> <a href="'+link('earth',s)+'" target="_blank" rel="noopener">Earth</a> <a href="'+routeLink(act,s)+'" target="_blank" rel="noopener">路線</a></span>'
     +'<button class="want'+(m==='ok'?' on':'')+'" data-act="mark" data-i="'+s.i+'" aria-pressed="'+(m==='ok')+'">'+(m==='ok'?'✓ 想去':'想去')+'</button></div></div>'}).join('');
  /* summary per base */
  var sum=state.bases.map(function(id,i){
    var b=r.B.filter(function(x){return x.id===id})[0],oks=r.S.filter(function(s){return state.marks[mk(r.id,id,s.i)]==='ok'});
    var tot=0;oks.forEach(function(s){tot+=leg(r,b,s).min*2});
    var avg=oks.length?tot/2/oks.length:0,over=oks.length>a[i]-1&&oks.length>a[i];
    var longDay=oks.filter(function(s){return leg(r,b,s).min*2>state.maxMin*2*0.95}).length;
    return '<div class="line"><span>'+(i+1)+'. '+b.name+' · '+a[i]+' 天</span><span class="mono">'+oks.length+' / '+spokeDays(i)+' 個想去</span></div>'
      +(oks.length?'<div class="line"><span class="sub" style="margin:0">平均單程 / 往返合計</span><span class="mono">'+fmtMin(avg)+' / '+fmtMin(tot)+'</span></div>':'')
      +(oks.length>a[i]?'<div class="warn">景點比天數多 '+(oks.length-a[i])+' 個,需刪減或延長天數。</div>':'')
  }).join('');
  var ai=state.bases.indexOf(act.id),need=spokeDays(ai),have=r.S.filter(function(s){return state.marks[mk(r.id,act.id,s.i)]==='ok'}).length;
  var tip=state.tip4Seen?'<p class="help"><a href="#" data-act="tip4">看操作說明</a></p>'
    :'<div class="tip"><b>這一步怎麼做</b><ol><li>拉「單程上限」,決定每天願意開多遠,地圖上的虛線圈會跟著變。</li><li>點景點的「街景」或「Earth」,看那裡是不是你要的樣子。</li><li>想去的景點按「想去」(再按一次取消)。每個住宿點都要做一遍,做完按「產生完整行程」。</li></ol><button class="btn" data-act="tip4done">知道了</button></div>';
  var prog='<div class="prog'+(have>=need&&need>0?' full':'')+'"><div class="bar"><i style="width:'+(need?Math.min(100,have/need*100):0)+'%"></i></div><span>'+(need?act.name+' 要排 '+need+' 天,已選 '+have+' 個想去'+(have>need?'。多了 '+(have-need)+' 個,排不進去的會列在行程總覽。':have===need?'。剛好。':'。還差 '+(need-have)+' 個,不足會由系統補上。'):act.name+' 沒有要排的輻射天數,天數太少可回上一步增加。')+'</span></div>';
  return '<h2>'+r.name+':每日輻射</h2><p class="sub">虛線圈是單程上限的範圍。</p>'+tip
   +'<div class="tabs">'+tabs+'</div>'+prog
   +'<div class="row"><label for="maxmin">單程上限</label><input id="maxmin" type="range" min="30" max="180" step="10" value="'+state.maxMin+'" data-act="maxmin"><span class="val" id="maxv">'+state.maxMin+' 分</span></div>'
   +(hasX?'<div class="row" style="margin-top:6px"><input type="checkbox" id="xmas" data-act="xmas"'+(state.xmasOnly?' checked':'')+'><label for="xmas">只看聖誕市集(11 月底至 12 月)</label></div>':'')
   +(HIST?'<div class="row" style="margin-top:6px"><input type="checkbox" id="hideseen" data-act="hideseen"'+(state.hideSeen?' checked':'')+'><label for="hideseen">隱藏去過的景點</label></div>':'')
   +'<div class="sum" style="margin-top:12px"><h3>行程進度 · '+state.days+' 天</h3>'+sum+'</div>'
   +(rows?'<div class="bulk"><button data-act="markall">範圍內全部標為想去</button><button data-act="clearmarks">清除這個住宿點的標記</button></div>':'')
   +(rows||'<p class="fold">此範圍內沒有景點,請拉大單程上限或換住宿點。</p>')
   +(out?'<p class="fold">另有 '+out+' 個景點超過 '+state.maxMin+' 分鐘,已在地圖上淡化。</p>':'')
   +'<p class="note">距離為直線 × '+ROAD+' 的估算,車速以 '+r.speed+' km/h 計。山區與海岸公路實際更慢,請按「路線」用 Google 地圖確認。</p>'
   +'<div class="nav"><button class="btn alt" data-act="step" data-n="3">上一步</button><button class="btn" data-act="step" data-n="5">產生完整行程</button></div>';
}
function render(){
  var sc=body.scrollTop;renderSteps();
  body.innerHTML=[null,s1,s2,s3,s4,s5][state.step]();
  body.scrollTop=sc;
}
body.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var a=t.getAttribute('data-act'),id=t.getAttribute('data-id');
  if(a==='terrain'){state.terrain=id;state.step=2;save();render();fitMatching();draw()}
  else if(a==='clearterrain'){e.preventDefault();state.terrain=null;save();render();fitMatching()}
  else if(a==='region'){pickRegion(id)}
  else if(a==='base'){toggleBase(id)}
  else if(a==='copyplan'){copyOut(id,t)}
  else if(a==='sheet'){openSheet()}
  else if(a==='cloudsave'){
    var inp=document.getElementById('planname'),cr=R(),cp=buildPlan();
    var row={name:((inp&&inp.value)||'').trim().slice(0,60)||(cr.name+' '+state.days+' 天'),region:cr.name.slice(0,60),days:state.days,
      bases:cp.bs.map(function(b){return b.name}).join(' → ').slice(0,200),
      spots:cp.days.filter(function(d){return d.spot}).map(function(d){return d.spot.name}).join('、').slice(0,1000)};
    CLOUD.busy=true;CLOUD.msg='儲存中…';render();
    window.cloud.add(row).then(function(){CLOUD.msg='已儲存。';CLOUD.loaded=false;CLOUD.busy=false;render()})
      .catch(function(e){CLOUD.busy=false;CLOUD.msg='儲存失敗:'+(e&&e.message||e);render()})}
  else if(a==='tip4done'||a==='tip4'){e.preventDefault();state.tip4Seen=(a==='tip4done');save();render()}
  else if(a==='markall'||a==='clearmarks'){var rr=R(),ab=rr.B.filter(function(b){return b.id===state.active})[0]||rr.B[0];
    rr.S.forEach(function(s){var key=mk(rr.id,ab.id,s.i);
      if(a==='clearmarks')delete state.marks[key];
      else if(inRange(rr,ab,s)&&state.marks[key]!=='no')state.marks[key]='ok'});
    save();render();draw()}
  else if(a==='xmas'){state.xmasOnly=t.checked;save();render();draw()}
  else if(a==='hideseen'){state.hideSeen=t.checked;save();render();draw()}
  else if(a==='onlynew'){state.onlyNew=t.checked;save();render()}
  else if(a==='trip'){var ti=+id;state.trip=state.trip===ti?null:ti;save();render();
    if(state.trip!==null){var tp=TRIPD[ti].vp.map(function(p){return [p[0]/K+LON0,0]});/* fit by projected pts */
      var xs=TRIPD[ti].vp.map(function(p){return p[0]}),ys=TRIPD[ti].vp.map(function(p){return p[1]});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      flyTo({cx:(x0+x1)/2,cy:(y0+y1)/2,w:Math.min(W*1.15,Math.max((x1-x0)*1.4,(y1-y0)*1.4*cw/ch,60))})}
    else fitEurope();draw()}
  else if(a==='active'){state.active=id;save();render();draw();fitRegion()}
  else if(a==='mark'){var key=mk(state.region,state.active,+t.getAttribute('data-i'));
    if(state.marks[key]==='ok')delete state.marks[key];else state.marks[key]='ok';save();render();draw()}
  else if(a==='step'){go(+t.getAttribute('data-n'))}
});
body.addEventListener('input',function(e){
  var t=e.target;if(t.id==='planname'){CLOUD.name=t.value;return}
  if(t.id==='startdate'){state.startDate=t.value;save();render();return}
  if(t.id==='days'){state.days=+t.value;document.getElementById('daysv').textContent=state.days+' 天';save()}
  if(t.id==='maxmin'){state.maxMin=+t.value;document.getElementById('maxv').textContent=state.maxMin+' 分';save();draw()}
});
body.addEventListener('change',function(e){if(e.target.id==='days')render();if(e.target.id==='maxmin')render()});
body.addEventListener('mouseover',function(e){
  var s=e.target.closest('[data-spot]'),c=e.target.closest('[data-act="region"]');
  var ns=s?+s.getAttribute('data-spot'):null,nr=c?c.getAttribute('data-id'):null;
  if(ns!==hoverSpot||nr!==hoverRegion){hoverSpot=ns;hoverRegion=nr;draw()}});
body.addEventListener('mouseleave',function(){if(hoverSpot!==null||hoverRegion){hoverSpot=null;hoverRegion=null;draw()}});
[stepsEl,document.getElementById('crumb')].forEach(function(el){el.addEventListener('click',function(e){var t=e.target.closest('[data-act="step"]');if(t)go(+t.getAttribute('data-n'))})});
(function(){var b=document.getElementById('reset'),t=0;
  b.onclick=function(){
    if(!t){b.textContent='再按一次清除全部';b.style.borderColor='var(--route)';b.style.color='var(--route)';t=setTimeout(function(){t=0;b.textContent='重設';b.style.borderColor='';b.style.color=''},3000);return}
    clearTimeout(t);t=0;b.textContent='重設';b.style.borderColor='';b.style.color='';
    var seen=state.tip4Seen;state=JSON.parse(JSON.stringify(DEF));state.tip4Seen=seen;save();render();body.scrollTop=0;fitEurope();draw()};
})();

/* 手機:拖曳或點一下調整地圖與面板高度 */
(function(){var g=document.getElementById('grip'),app=document.getElementById('app'),y0=null,h0=0,mv=false,presets=['42%','22%','68%'],pi=0;
  g.addEventListener('pointerdown',function(e){y0=e.clientY;h0=document.getElementById('mapwrap').getBoundingClientRect().height;mv=false;g.setPointerCapture(e.pointerId)});
  g.addEventListener('pointermove',function(e){if(y0===null)return;var dy=e.clientY-y0;if(Math.abs(dy)>4)mv=true;if(!mv)return;app.style.setProperty('--mh',Math.max(70,Math.min(window.innerHeight-180,h0+dy))+'px')});

/* ---------- 行程單 / 匯出 ---------- */
var sheet=document.getElementById('sheet');
function planRows(p){
  return p.days.map(function(d){
    var sp=d.type==='spoke',tr=d.type==='transfer';
    return {n:d.n,date:dayLabel(d.n),base:d.base.name,
      kind:({arrive:'抵達',depart:'離開',transfer:'換宿',spoke:'景點'})[d.type],
      item:sp?d.spot.name:(tr?'→ '+d.to.name:(d.type==='arrive'?'抵達、熟悉周邊':'整理行李、離開')),
      note:sp?(d.spot.note||''):'',
      km:sp?Math.round(d.km*2):(tr?Math.round(p.xfer.km):''),
      min:sp?Math.round(d.min*2):(tr?Math.round(p.xfer.min):''),
      status:sp?(d.src==='ok'?'想去':'系統補上'):'',
      url:sp?routeLink(d.base,d.spot):(tr?routeLink(d.base,d.to):''),
      sv:sp?link('sv',d.spot):'',earth:sp?link('earth',d.spot):''};
  });
}
function exportOf(kind){
  var p=buildPlan(),r=R(),rows=planRows(p),title=r.name+' · '+state.days+' 天';
  if(kind==='csv'){
    var q=function(v){return '"'+String(v).replace(/"/g,'""')+'"'};
    return '天,日期,住宿,類型,內容,往返公里,往返分鐘,狀態,路線\n'+rows.map(function(x){return [x.n,x.date,x.base,x.kind,x.item,x.km,x.min,x.status,x.url].map(q).join(',')}).join('\n');
  }
  if(kind==='md'){
    return '# '+title+'\n\n住宿:'+p.bs.map(function(b,i){return (i+1)+'. '+b.name}).join(' → ')+'  \n總車程(含換宿)約 '+fmtMin(p.drive)+'\n\n| 天 | 日期 | 住宿 | 內容 | 往返 | 狀態 |\n|---|---|---|---|---|---|\n'
      +rows.map(function(x){return '| '+x.n+' | '+x.date+' | '+x.base+' | '+(x.url?'['+x.item+']('+x.url+')':x.item)+' | '+(x.km!==''?x.km+' km · '+fmtMin(x.min):'')+' | '+x.status+' |'}).join('\n');
  }
  return planText(p);
}
function copyOut(kind,btn){
  var tx=exportOf(kind),label=btn.textContent;
  function fb(){var ta=document.getElementById('plantext')||document.getElementById('sheettext');if(!ta)return;ta.hidden=false;ta.style.display='block';ta.value=tx;ta.focus();ta.select()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){btn.textContent='已複製';setTimeout(function(){btn.textContent=label},1500)},fb)}else fb();
}
function openSheet(){
  var p=buildPlan(),r=R(),rows=planRows(p),spokes=rows.filter(function(x){return x.kind==='景點'}).length;
  var h='<div class="sheetbar"><div class="tabs"><button data-act="copyplan" data-id="txt">文字 · 貼到訊息或筆記</button><button data-act="copyplan" data-id="md">Markdown · 貼到文件</button><button data-act="copyplan" data-id="csv">CSV · 貼到試算表</button></div><button class="btn" data-act="closesheet">關閉</button></div>'
   +'<div class="sheetwrap"><h1>'+r.name+'</h1><p class="meta">'+state.days+' 天 · '+p.bs.map(function(b,i){return (i+1)+'. '+b.name}).join(' → ')+(state.startDate?' · '+state.startDate+' 出發':'')+'</p>'
   +'<div class="kv"><span>總車程 <b>'+fmtMin(p.drive)+'</b></span>'+(p.bs.length===2?'<span>換宿 <b>'+Math.round(p.xfer.km)+' km · '+fmtMin(p.xfer.min)+'</b></span>':'')+'<span>景點 <b>'+spokes+'</b> 個(想去 <b>'+p.ok+'</b>)</span></div>';
  var lastBase=null;
  rows.forEach(function(x){
    if(x.base!==lastBase){h+='<div class="bh">住宿 '+(p.bs.length===2?(p.bs.map(function(b){return b.name}).indexOf(x.base)+1)+' · ':'· ')+x.base+'</div>';lastBase=x.base}
    h+='<div class="drow"><div class="dn">D'+x.n+(x.date?'<small>'+x.date+'</small>':'')+'</div><div class="what"><b>'+x.item+'</b>'+(x.status?'<span class="pill" style="color:'+(x.status==='想去'?'var(--good)':'var(--muted)')+'">'+x.status+'</span>':'')+(x.note?'<small>'+x.note+'</small>':'')
      +(x.url?'<span class="links">'+(x.sv?'<a href="'+x.sv+'" target="_blank" rel="noopener">街景</a> <a href="'+x.earth+'" target="_blank" rel="noopener">Earth</a> ':'')+'<a href="'+x.url+'" target="_blank" rel="noopener">路線</a></span>':'')+'</div>'
      +'<div class="dst">'+(x.km!==''?x.km+' km<br>'+fmtMin(x.min):'')+'</div></div>';
  });
  h+='<textarea id="sheettext" readonly hidden style="width:100%;height:180px;margin-top:16px;font-family:var(--f-mono);font-size:12px;background:transparent;color:inherit;border:1px solid var(--line);border-radius:8px;padding:8px"></textarea>'
   +'<p class="note">往返距離與時間是估算值,出發前請用路線連結確認。</p></div>';
  sheet.innerHTML=h;sheet.classList.add('on');sheet.scrollTop=0;
}
sheet.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var a=t.getAttribute('data-act');
  if(a==='closesheet')sheet.classList.remove('on');else if(a==='copyplan')copyOut(t.getAttribute('data-id'),t)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')sheet.classList.remove('on')});

sizeMap();render();
if(state.step>=3&&state.region){var _r=R(),_p=_r.B.map(function(b){return [b.lng,b.lat]}).concat(_r.S.map(function(s){return [s.lng,s.lat]}));view=pts2view(_p,1.35)}
else{view=pts2view([[-10,36],[30,60]],1.1)}
draw();
</script>
